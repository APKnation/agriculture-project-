services:
  # Backend Django Service
  - type: web
    name: agriculture-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriculture-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agriculture-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "agriculture-backend.onrender.com"
      - key: FRONTEND_URL
        value: "https://agriculture-frontend.onrender.com"

  # PostgreSQL Database
  - type: pserv
    name: agriculture-db
    env: postgres
    plan: free
    databases:
      - name: agriculture_db

  # Redis Cache
  - type: redis
    name: agriculture-redis
    plan: free
    ipAllowList: []

  # Frontend Vue.js Service
  - type: web
    name: agriculture-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agriculture-backend.onrender.com/api
