services:
  # Backend Django Service
  - type: web
    name: agriculture-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: "backend.settings_production"
      - key: DATABASE_URL
        fromDatabase:
          name: agriculture-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "agriculture-backend.onrender.com"
      - key: FRONTEND_URL
        value: "https://kilimo.netlify.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kilimo.netlify.app,http://localhost:4173,http://localhost:5173,http://127.0.0.1:4173,http://127.0.0.1:5173,https://*.onrender.com,https://*.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kilimo.netlify.app,http://localhost:4173,http://localhost:5173,https://*.onrender.com,https://*.netlify.app"

  # PostgreSQL Database
  - type: pserv
    name: agriculture-db
    env: postgres
    plan: free
    databases:
      - name: agriculture_db

  # Redis Cache
  - type: redis
    name: agriculture-redis
    plan: free
    ipAllowList: []

  # Frontend Vue.js Service
  - type: web
    name: agriculture-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agriculture-backend.onrender.com/api
      - key: FRONTEND_URL
        value: https://agriculture-project-9-nvhd.onrender.com
