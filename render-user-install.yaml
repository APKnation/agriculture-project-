services:
  # Backend Django Service
  - type: web
    name: agriculture-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install --user Django==5.2.10 djangorestframework==3.15.2 Pillow==10.2.0 requests==2.31.0"
    startCommand: "cd backend && python manage.py runserver 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agriculture-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"

  # PostgreSQL Database
  - type: pserv
    name: agriculture-db
    env: postgres
    plan: free
    databases:
      - name: agriculture_db

  # Frontend Vue.js Service
  - type: web
    name: agriculture-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://agriculture-backend.onrender.com/api
